services:
  postgres-db:
    image: postgres:16-alpine
    container_name: flowcare-db-dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=flowadmin
      - POSTGRES_PASSWORD=flowpass
      - POSTGRES_DB=flowcare_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowadmin -d flowcare_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  flowcare-app:
    build: .
    container_name: flowcare-api
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/flowcare_dev
      - SPRING_DATASOURCE_USERNAME=flowadmin
      - SPRING_DATASOURCE_PASSWORD=flowpass
      - UPLOAD_DIR=/app/uploads
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data: